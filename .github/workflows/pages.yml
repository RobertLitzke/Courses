name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Every course into its folder, then the catalog and the one service worker.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's file sync can take more than ten minutes on a large site, and
      # deploy-pages caps its own timeout at ten minutes (a longer `timeout` is
      # ignored), so a deploy that times out is tried again, twice, with the
      # same build.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}" >> "$GITHUB_OUTPUT"
